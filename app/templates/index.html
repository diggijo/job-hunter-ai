<!DOCTYPE html>
<html>
<head>
    <title>Job Hunter AI</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <div class="page-header">
        <h1>Job Hunter AI</h1>
        <p>{{ matching_jobs|length }} potential jobs found</p>
    </div>

    <div class="job-list">
        {% for job in matching_jobs %}
            <div class="job-card">

                <h2>{{ job["title"] }}</h2>

                <p class="company">
                    {{ job["company"] }}
                </p>

                <p class="location">
                    {{ job["location"] }}
                </p>

                <p class="source">
                    Source: {{ job["source"] }}
                </p>

                <a class="job-link"
                href="{{ job['url'] }}"
                target="_blank">
                    View Job
                </a>

            </div>
        {% endfor %}
    </div>

</body>
</html>
